# ทุกด่านต้องเขียวก่อน merge ไม่มีข้อยกเว้น
# specs/standards/testing.md หัวข้อ 1, RQ-8, RQ-14
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# เวอร์ชันตายตัวทั้งในเครื่องและ CI (P-8)
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # เวอร์ชัน PostgreSQL มีแหล่งเดียวคือ config/postgres.env (F-03 plan.md ข้อ 8)
  # ส่งต่อเป็น job output เพราะ workflow env อ้างใน service image ไม่ได้
  config:
    name: ค่ากลาง — เวอร์ชัน PostgreSQL
    runs-on: ubuntu-latest
    outputs:
      postgres_version: ${{ steps.read.outputs.postgres_version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version="$(grep '^POSTGRES_VERSION=' config/postgres.env | cut -d= -f2)"
          test -n "$version" || { echo "::error::config/postgres.env ไม่มี POSTGRES_VERSION"; exit 1; }
          echo "postgres_version=$version" >> "$GITHUB_OUTPUT"

  backend:
    name: หลังบ้าน — lint, types, imports, tests
    runs-on: ubuntu-latest
    needs: config
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:${{ needs.config.outputs.postgres_version }}
        env:
          POSTGRES_DB: tiewtrade
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiewtrade"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    # URL แยกหนึ่งอันต่อหนึ่งบทบาท (F-03 plan.md ข้อ 7)
    # รหัสผ่านชุดนี้ใช้ได้เฉพาะ CI และเครื่องนักพัฒนา บนเครื่องจริงเป็นงาน F-31
    env:
      TIEWTRADE_DATABASE_URL_MIGRATOR: postgresql+asyncpg://tiewtrade_migrator:dev_migrator@127.0.0.1:5432/tiewtrade
      TIEWTRADE_DATABASE_URL_API: postgresql+asyncpg://tiewtrade_api:dev_api@127.0.0.1:5432/tiewtrade
      TIEWTRADE_DATABASE_URL_ENGINE: postgresql+asyncpg://tiewtrade_engine:dev_engine@127.0.0.1:5432/tiewtrade
      TIEWTRADE_DATABASE_URL_ENGINE_SCAN: postgresql+asyncpg://tiewtrade_engine_scan:dev_engine_scan@127.0.0.1:5432/tiewtrade
      TIEWTRADE_DATABASE_URL_MARKET_DATA: postgresql+asyncpg://tiewtrade_market_data:dev_market_data@127.0.0.1:5432/tiewtrade
      TIEWTRADE_DATABASE_URL_AUTH: postgresql+asyncpg://tiewtrade_auth:dev_auth@127.0.0.1:5432/tiewtrade
      # เทสต์ของ F-05 ต้องสมัครได้ และไคลเอนต์ของเทสต์ใช้ http
      # ค่าเริ่มต้นของทั้งสองค่าคือ "ปิดการสมัคร" และ "ตั้งธง Secure"
      TIEWTRADE_REDIS_URL_API: redis://127.0.0.1:6379/0
      TIEWTRADE_REDIS_URL_MARKET_DATA: redis://127.0.0.1:6379/0
      TIEWTRADE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TIEWTRADE_PRICE_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TIEWTRADE_SIGNUP_OPEN: "1"
      TIEWTRADE_COOKIE_SECURE: "0"
      # กุญแจปิดผนึก secret ของ TOTP (F-06) — **ค่านี้ใช้ได้เฉพาะเครื่องพัฒนาและ CI**
      # บนเครื่องจริงยังเป็นข้อที่ต้องตัดสิน (T-03) ซึ่งเป็นงาน F-31
      TIEWTRADE_SEALING_KEY_TOTP_SECRET: "1:ZGV2LW9ubHkta2V5LW5vdC1hLXNlY3JldC0zMmJ5dGU="
      # กุญแจของ API key แยกจาก TOTP (F-07 RQ-4) — ใช้เฉพาะพัฒนาและ CI
      TIEWTRADE_SEALING_KEY_VENUE_API_SECRET: "1:VlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlY="
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # คำสั่งชุดเดียวกับที่รันในเครื่อง (RQ-9, standards/backend.md หัวข้อ 6)
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: import-linter
        run: uv run lint-imports

      # บทบาทฐานข้อมูลสร้างด้วย superuser ของ container ครั้งเดียว (plan.md ข้อ 1)
      # migration รันด้วยบทบาท migrator เท่านั้น (RQ-5.1)
      - name: bootstrap ฐานข้อมูล (บทบาทและ event trigger)
        # รันทั้งโฟลเดอร์ตามลำดับชื่อ เหมือนที่ Compose ทำตอนสร้าง volume
        # ไฟล์ทุกไฟล์รันซ้ำได้ จึงรันกับฐานข้อมูลที่มีอยู่แล้วได้ด้วย
        run: |
          for script in db/bootstrap/*.sql; do
            echo "== $script"
            psql "postgresql://postgres:postgres@127.0.0.1:5432/tiewtrade" -v ON_ERROR_STOP=1 -f "$script"
          done
      - name: migration
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest

  api-contract:
    name: สัญญา API — ชนิดข้อมูลสองฝั่งต้องตรงกัน
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # สร้างสัญญา API ใหม่จากโค้ด แล้วเทียบกับไฟล์ที่ commit ไว้ (P-5)
      - name: สร้าง openapi.json ใหม่
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -m tiewtrade.services.api.openapi_export

      - name: เทียบกับที่ commit ไว้
        run: |
          git diff --exit-code -- backend/openapi.json \
            || { echo "::error::openapi.json ไม่ตรงกับโค้ด — รัน uv run python -m tiewtrade.services.api.openapi_export แล้ว commit"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # สร้างชนิดข้อมูลหน้าบ้านใหม่ แล้วเทียบ ถ้าต่างถือว่าแดง (RQ-16)
      - name: สร้างชนิดข้อมูลหน้าบ้านใหม่แล้วเทียบ
        working-directory: frontend
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- src/api-types.ts \
            || { echo "::error::api-types.ts ไม่ตรงกับสัญญา API — รัน npm run gen:api แล้ว commit"; exit 1; }

  frontend:
    name: หน้าบ้าน — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm run test

  e2e:
    name: e2e — เบราว์เซอร์จริงเห็นข้อมูลจาก API จริง
    runs-on: ubuntu-latest
    needs: config
    # ตั้งแต่ F-05 แอปสร้าง engine ของฐานข้อมูลตอนเปิด และ middleware ตัวตน
    # ใช้ฐานข้อมูลทุกคำขอ — งานนี้จึงต้องมีฐานข้อมูลจริงเหมือนงานหลังบ้าน
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:${{ needs.config.outputs.postgres_version }}
        env:
          POSTGRES_DB: tiewtrade_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiewtrade_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TIEWTRADE_E2E_DATABASE_NAME: tiewtrade_e2e
      TIEWTRADE_DATABASE_URL_MIGRATOR: postgresql+asyncpg://tiewtrade_migrator:dev_migrator@127.0.0.1:5432/tiewtrade_e2e
      TIEWTRADE_DATABASE_URL_API: postgresql+asyncpg://tiewtrade_api:dev_api@127.0.0.1:5432/tiewtrade_e2e
      TIEWTRADE_DATABASE_URL_AUTH: postgresql+asyncpg://tiewtrade_auth:dev_auth@127.0.0.1:5432/tiewtrade_e2e
      # F-07 e2e เรียก worker จริงคู่กับ FakeVenue จึงต้องใช้บทบาททั้งสองนี้
      TIEWTRADE_DATABASE_URL_ENGINE: postgresql+asyncpg://tiewtrade_engine:dev_engine@127.0.0.1:5432/tiewtrade_e2e
      TIEWTRADE_DATABASE_URL_ENGINE_SCAN: postgresql+asyncpg://tiewtrade_engine_scan:dev_engine_scan@127.0.0.1:5432/tiewtrade_e2e
      TIEWTRADE_DATABASE_URL_MARKET_DATA: postgresql+asyncpg://tiewtrade_market_data:dev_market_data@127.0.0.1:5432/tiewtrade_e2e
      TIEWTRADE_REDIS_URL_API: redis://127.0.0.1:6379/0
      TIEWTRADE_REDIS_URL_MARKET_DATA: redis://127.0.0.1:6379/0
      TIEWTRADE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      TIEWTRADE_PRICE_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TIEWTRADE_SIGNUP_OPEN: "1"
      TIEWTRADE_COOKIE_SECURE: "0"
      # กุญแจปิดผนึก secret ของ TOTP (F-06) — **ค่านี้ใช้ได้เฉพาะเครื่องพัฒนาและ CI**
      # บนเครื่องจริงยังเป็นข้อที่ต้องตัดสิน (T-03) ซึ่งเป็นงาน F-31
      TIEWTRADE_SEALING_KEY_TOTP_SECRET: "1:ZGV2LW9ubHkta2V5LW5vdC1hLXNlY3JldC0zMmJ5dGU="
      # แอปอ่านตอนเริ่ม แม้ e2e ยังไม่ใช้เส้นทาง API key
      TIEWTRADE_SEALING_KEY_VENUE_API_SECRET: "1:VlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlY="
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --frozen
        working-directory: backend

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: bootstrap ฐานข้อมูล (บทบาทและ event trigger)
        working-directory: backend
        run: |
          for script in db/bootstrap/*.sql; do
            psql "postgresql://postgres:postgres@127.0.0.1:5432/tiewtrade_e2e" -v ON_ERROR_STOP=1 -f "$script"
          done
      - name: migration
        working-directory: backend
        run: uv run alembic upgrade head

      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: container — ทั้งสองฝั่งรันใน container ได้
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build และรัน compose
        # ลบค่าจาก shell ก่อน เพื่อไม่ให้ค่าภายนอกทับเวอร์ชันกลางโดยไม่ตั้งใจ
        run: env -u POSTGRES_VERSION docker compose --env-file config/postgres.env up -d --build --wait

      - name: เรียก /health ผ่าน container
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: หน้าบ้านตอบจาก container
        run: curl --fail --silent --show-error http://localhost:5173/ > /dev/null

      - name: log ถ้าพัง
        if: failure()
        run: env -u POSTGRES_VERSION docker compose --env-file config/postgres.env logs

      - name: ปิด
        if: always()
        run: env -u POSTGRES_VERSION docker compose --env-file config/postgres.env down -v
