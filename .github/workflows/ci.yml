# ทุกด่านต้องเขียวก่อน merge ไม่มีข้อยกเว้น
# specs/standards/testing.md หัวข้อ 1, RQ-8, RQ-14
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# เวอร์ชันตายตัวทั้งในเครื่องและ CI (P-8)
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: หลังบ้าน — lint, types, imports, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # คำสั่งชุดเดียวกับที่รันในเครื่อง (RQ-9, standards/backend.md หัวข้อ 6)
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: import-linter
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest

  api-contract:
    name: สัญญา API — ชนิดข้อมูลสองฝั่งต้องตรงกัน
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # สร้างสัญญา API ใหม่จากโค้ด แล้วเทียบกับไฟล์ที่ commit ไว้ (P-5)
      - name: สร้าง openapi.json ใหม่
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -m services.api.openapi_export

      - name: เทียบกับที่ commit ไว้
        run: |
          git diff --exit-code -- backend/openapi.json \
            || { echo "::error::openapi.json ไม่ตรงกับโค้ด — รัน uv run python -m services.api.openapi_export แล้ว commit"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # สร้างชนิดข้อมูลหน้าบ้านใหม่ แล้วเทียบ ถ้าต่างถือว่าแดง (RQ-16)
      - name: สร้างชนิดข้อมูลหน้าบ้านใหม่แล้วเทียบ
        working-directory: frontend
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- src/api-types.ts \
            || { echo "::error::api-types.ts ไม่ตรงกับสัญญา API — รัน npm run gen:api แล้ว commit"; exit 1; }

  frontend:
    name: หน้าบ้าน — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm run test

  e2e:
    name: e2e — เบราว์เซอร์จริงเห็นข้อมูลจาก API จริง
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv sync --frozen
        working-directory: backend

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: container — ทั้งสองฝั่งรันใน container ได้
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build และรัน compose
        run: docker compose up -d --build --wait

      - name: เรียก /health ผ่าน container
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: หน้าบ้านตอบจาก container
        run: curl --fail --silent --show-error http://localhost:5173/ > /dev/null

      - name: log ถ้าพัง
        if: failure()
        run: docker compose logs

      - name: ปิด
        if: always()
        run: docker compose down -v
