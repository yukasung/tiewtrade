# Alembic ของ F-03 (plan.md ข้อ 2)
#
# URL ไม่อยู่ในไฟล์นี้ — อ่านจาก environment ของบทบาท migrator ใน migrations/env.py
# เพราะไฟล์นี้อยู่ใน git และรหัสผ่านต้องไม่อยู่ใน git (security.md หัวข้อ 4)

[alembic]
script_location = migrations
prepend_sys_path = src
# แยกด้วยรูปแบบของ os ไม่ใช่การเดาจากช่องว่าง (Alembic เตือนไว้)
path_separator = os
# เรียงตามหมายเลข ไม่ใช่ตามเวลาที่สร้าง (RQ-1)
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = WARNING
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
