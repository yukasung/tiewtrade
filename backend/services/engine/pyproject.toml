[project]
name = "tiewtrade-engine"
version = "0.1.0"
description = "Workspace engine: strategy host, risk, order manager, paper execution"
requires-python = ">=3.12"
dependencies = ["tiewtrade-core", "tiewtrade-strategies", "tiewtrade-infra"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade_engine"]
