[project]
name = "tiewtrade-execution"
version = "0.1.0"
description = "Live Execution Gateway (Phase 2)"
requires-python = ">=3.12"
dependencies = ["tiewtrade-core", "tiewtrade-binance", "tiewtrade-infra"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade_execution"]
