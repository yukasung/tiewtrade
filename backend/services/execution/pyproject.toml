[project]
name = "fasttrade-execution"
version = "0.1.0"
description = "Live Execution Gateway (Phase 2)"
requires-python = ">=3.12"
dependencies = ["fasttrade-core", "fasttrade-binance", "fasttrade-infra"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasttrade_execution"]
