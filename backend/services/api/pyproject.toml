[project]
name = "fasttrade-api"
version = "0.1.0"
description = "REST + WebSocket API service"
requires-python = ">=3.12"
dependencies = ["fasttrade-core", "fasttrade-infra", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasttrade_api"]
