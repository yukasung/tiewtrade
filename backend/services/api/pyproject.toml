[project]
name = "tiewtrade-api"
version = "0.1.0"
description = "REST + WebSocket API service"
requires-python = ">=3.12"
dependencies = ["tiewtrade-core", "tiewtrade-infra", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade_api"]
