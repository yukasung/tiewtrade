[project]
name = "fasttrade-notifier"
version = "0.1.0"
description = "Notification delivery: in-app, email, Telegram"
requires-python = ">=3.12"
dependencies = ["fasttrade-core", "fasttrade-infra"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasttrade_notifier"]
