[project]
name = "tiewtrade-notifier"
version = "0.1.0"
description = "Notification delivery: in-app, email, Telegram"
requires-python = ">=3.12"
dependencies = ["tiewtrade-core", "tiewtrade-infra"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade_notifier"]
