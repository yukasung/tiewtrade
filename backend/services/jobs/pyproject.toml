[project]
name = "tiewtrade-jobs"
version = "0.1.0"
description = "Scheduled idempotent jobs"
requires-python = ">=3.12"
dependencies = ["tiewtrade-core", "tiewtrade-infra"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade_jobs"]
