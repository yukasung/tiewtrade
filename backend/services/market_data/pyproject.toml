[project]
name = "tiewtrade-market-data"
version = "0.1.0"
description = "Market data ingestion per Exchange Venue"
requires-python = ">=3.12"
dependencies = ["tiewtrade-core", "tiewtrade-binance", "tiewtrade-infra"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade_market_data"]
