# tiewtrade backend workspace (ADR-0006). The root is not a package; it wires
# the workspace members together and holds shared tool configuration.

[project]
name = "tiewtrade-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tiewtrade-core",
    "tiewtrade-strategies",
    "tiewtrade-binance",
    "tiewtrade-infra",
    "tiewtrade-api",
    "tiewtrade-engine",
    "tiewtrade-market-data",
    "tiewtrade-execution",
    "tiewtrade-jobs",
    "tiewtrade-notifier",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
tiewtrade-core = { workspace = true }
tiewtrade-strategies = { workspace = true }
tiewtrade-binance = { workspace = true }
tiewtrade-infra = { workspace = true }
tiewtrade-api = { workspace = true }
tiewtrade-engine = { workspace = true }
tiewtrade-market-data = { workspace = true }
tiewtrade-execution = { workspace = true }
tiewtrade-jobs = { workspace = true }
tiewtrade-notifier = { workspace = true }

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# `Decimal as D` keeps numeric test cases readable.
"**/tests/**" = ["N817"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["packages", "services"]
explicit_package_bases = true
mypy_path = [
    "packages/core/src", "packages/strategies/src", "packages/binance/src", "packages/infra/src",
    "services/api/src", "services/engine/src", "services/market_data/src",
    "services/execution/src", "services/jobs/src", "services/notifier/src",
]
exclude = ["/tests/"]
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Trading Core and strategies carry the money logic: strictest checking.
[[tool.mypy.overrides]]
module = ["tiewtrade_core.*", "tiewtrade_strategies.*"]
strict = true

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]

# --- import-linter: architecture rules (ADR-0001, ADR-0006) -------------
[tool.importlinter]
root_packages = [
    "tiewtrade_core", "tiewtrade_strategies", "tiewtrade_binance", "tiewtrade_infra",
    "tiewtrade_api", "tiewtrade_engine", "tiewtrade_market_data",
    "tiewtrade_execution", "tiewtrade_jobs", "tiewtrade_notifier",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Trading Core is pure: no I/O frameworks and no other tiewtrade packages"
type = "forbidden"
source_modules = ["tiewtrade_core"]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "asyncpg", "redis", "httpx", "requests", "websockets",
    "tiewtrade_strategies", "tiewtrade_binance", "tiewtrade_infra",
    "tiewtrade_api", "tiewtrade_engine", "tiewtrade_market_data",
    "tiewtrade_execution", "tiewtrade_jobs", "tiewtrade_notifier",
]

[[tool.importlinter.contracts]]
name = "Strategies depend on Trading Core only (P-01: no Binance access)"
type = "forbidden"
source_modules = ["tiewtrade_strategies"]
forbidden_modules = [
    "fastapi", "sqlalchemy", "asyncpg", "redis", "httpx", "requests", "websockets",
    "tiewtrade_binance", "tiewtrade_infra",
    "tiewtrade_api", "tiewtrade_engine", "tiewtrade_market_data",
    "tiewtrade_execution", "tiewtrade_jobs", "tiewtrade_notifier",
]

[[tool.importlinter.contracts]]
name = "Shared packages depend on Trading Core only; composition happens in services"
type = "forbidden"
source_modules = ["tiewtrade_binance", "tiewtrade_infra"]
forbidden_modules = [
    "tiewtrade_strategies",
    "tiewtrade_api", "tiewtrade_engine", "tiewtrade_market_data",
    "tiewtrade_execution", "tiewtrade_jobs", "tiewtrade_notifier",
]

[[tool.importlinter.contracts]]
name = "Binance adapter and infra adapters are independent"
type = "independence"
modules = ["tiewtrade_binance", "tiewtrade_infra"]

[[tool.importlinter.contracts]]
name = "Services do not import each other"
type = "independence"
modules = [
    "tiewtrade_api", "tiewtrade_engine", "tiewtrade_market_data",
    "tiewtrade_execution", "tiewtrade_jobs", "tiewtrade_notifier",
]

# Inside the core, architecture §4.2 orders the modules. Nothing enforced this before, so
# the reasoning that puts a shared type in `market` held only as long as someone remembered
# it. Higher layers may import lower ones, never the reverse.
[[tool.importlinter.contracts]]
name = "Trading Core modules are layered (architecture §4.2)"
type = "layers"
layers = [
    "tiewtrade_core.execution",
    "tiewtrade_core.orders",
    "tiewtrade_core.margin",
    "tiewtrade_core.portfolio",
    "tiewtrade_core.market",
    "tiewtrade_core._decimal",
]

[[tool.importlinter.contracts]]
name = "Only execution and market-data may use the Binance package (P-01, ADR-0005)"
type = "forbidden"
source_modules = ["tiewtrade_api", "tiewtrade_engine", "tiewtrade_jobs", "tiewtrade_notifier"]
forbidden_modules = ["tiewtrade_binance"]
