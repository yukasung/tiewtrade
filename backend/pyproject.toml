# fasttrade backend workspace (ADR-0006). The root is not a package; it wires
# the workspace members together and holds shared tool configuration.

[project]
name = "fasttrade-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fasttrade-core",
    "fasttrade-strategies",
    "fasttrade-binance",
    "fasttrade-infra",
    "fasttrade-api",
    "fasttrade-engine",
    "fasttrade-market-data",
    "fasttrade-execution",
    "fasttrade-jobs",
    "fasttrade-notifier",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
fasttrade-core = { workspace = true }
fasttrade-strategies = { workspace = true }
fasttrade-binance = { workspace = true }
fasttrade-infra = { workspace = true }
fasttrade-api = { workspace = true }
fasttrade-engine = { workspace = true }
fasttrade-market-data = { workspace = true }
fasttrade-execution = { workspace = true }
fasttrade-jobs = { workspace = true }
fasttrade-notifier = { workspace = true }

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# `Decimal as D` keeps numeric test cases readable.
"**/tests/**" = ["N817"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["packages", "services"]
explicit_package_bases = true
mypy_path = [
    "packages/core/src", "packages/strategies/src", "packages/binance/src", "packages/infra/src",
    "services/api/src", "services/engine/src", "services/market_data/src",
    "services/execution/src", "services/jobs/src", "services/notifier/src",
]
exclude = ["/tests/"]
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Trading Core and strategies carry the money logic: strictest checking.
[[tool.mypy.overrides]]
module = ["fasttrade_core.*", "fasttrade_strategies.*"]
strict = true

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]

# --- import-linter: architecture rules (ADR-0001, ADR-0006) -------------
[tool.importlinter]
root_packages = [
    "fasttrade_core", "fasttrade_strategies", "fasttrade_binance", "fasttrade_infra",
    "fasttrade_api", "fasttrade_engine", "fasttrade_market_data",
    "fasttrade_execution", "fasttrade_jobs", "fasttrade_notifier",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Trading Core is pure: no I/O frameworks and no other fasttrade packages"
type = "forbidden"
source_modules = ["fasttrade_core"]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "asyncpg", "redis", "httpx", "requests", "websockets",
    "fasttrade_strategies", "fasttrade_binance", "fasttrade_infra",
    "fasttrade_api", "fasttrade_engine", "fasttrade_market_data",
    "fasttrade_execution", "fasttrade_jobs", "fasttrade_notifier",
]

[[tool.importlinter.contracts]]
name = "Strategies depend on Trading Core only (P-01: no Binance access)"
type = "forbidden"
source_modules = ["fasttrade_strategies"]
forbidden_modules = [
    "fastapi", "sqlalchemy", "asyncpg", "redis", "httpx", "requests", "websockets",
    "fasttrade_binance", "fasttrade_infra",
    "fasttrade_api", "fasttrade_engine", "fasttrade_market_data",
    "fasttrade_execution", "fasttrade_jobs", "fasttrade_notifier",
]

[[tool.importlinter.contracts]]
name = "Shared packages depend on Trading Core only; composition happens in services"
type = "forbidden"
source_modules = ["fasttrade_binance", "fasttrade_infra"]
forbidden_modules = [
    "fasttrade_strategies",
    "fasttrade_api", "fasttrade_engine", "fasttrade_market_data",
    "fasttrade_execution", "fasttrade_jobs", "fasttrade_notifier",
]

[[tool.importlinter.contracts]]
name = "Binance adapter and infra adapters are independent"
type = "independence"
modules = ["fasttrade_binance", "fasttrade_infra"]

[[tool.importlinter.contracts]]
name = "Services do not import each other"
type = "independence"
modules = [
    "fasttrade_api", "fasttrade_engine", "fasttrade_market_data",
    "fasttrade_execution", "fasttrade_jobs", "fasttrade_notifier",
]

[[tool.importlinter.contracts]]
name = "Only execution and market-data may use the Binance package (P-01, ADR-0005)"
type = "forbidden"
source_modules = ["fasttrade_api", "fasttrade_engine", "fasttrade_jobs", "fasttrade_notifier"]
forbidden_modules = ["fasttrade_binance"]
