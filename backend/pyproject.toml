[project]
name = "tiewtrade-backend"
version = "0.1.0"
description = "TiewTrade backend — Spot trading on Binance TH"
requires-python = "==3.12.*"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54,<0.55",
    # ฐานข้อมูล (F-03) — SQLAlchemy 2 async ตาม tech-stack.md หัวข้อ 4
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # ตัวเชื่อม Binance TH (F-35) — ไคลเอนต์ HTTP ที่ async จริงและใช้ทดสอบได้ (Q-2)
    "httpx>=0.28",
    "websockets>=17.1,<18",
    "redis>=5,<8",
    # รหัสผ่าน (F-05) — argon2 ตาม standards/security.md หัวข้อ 1
    "argon2-cffi>=23.1",
    # ปิดผนึก secret ของ TOTP (F-06) — AES-GCM ตาม plan.md หัวข้อ 4.3
    # **ห้ามใช้กุญแจตัวเดียวกับ API secret ของตลาด** (RQ-14)
    "cryptography>=44.0",
]

[project.scripts]
indicator-builder = "tiewtrade.services.indicator_builder.main:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest>=8.3",
    "hypothesis>=6.119",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade"]

# ─────────────────────────────────────────────────────────────
# ruff — รูปแบบและ lint (RQ-8)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
# กรณีที่ต้องถูกปฏิเสธ (RQ-12) อยู่นอกเส้นทางที่ด่านปกติสแกน
# เทสต์ใน tests/gates/ จะรัน ruff กับไฟล์เหล่านี้เองและคาดหวังผลแดง
extend-exclude = ["tests/gates/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "RUF"]

# ─────────────────────────────────────────────────────────────
# mypy — ตรวจชนิดข้อมูล strict ทั้ง backend (RQ-10, P-3)
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
exclude = ["tests/gates/fixtures"]
strict = true
warn_unreachable = true
warn_no_return = true
extra_checks = true

# `core` เข้มกว่าที่อื่น เพราะโค้ดคำนวณเงินจะอยู่ที่นี่ทั้งหมด (RQ-10)
[[tool.mypy.overrides]]
module = "tiewtrade.core.*"
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_expr = true

# ─────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# เทสต์สัญญากับตลาดจริงไม่อยู่ในชุดปกติ เพราะต้องมีเน็ตและเรียกตลาดออกไปจริง
# งาน CI `venue-contract` สั่ง `-m venue_contract` ทับค่านี้เอง
addopts = "-q --strict-markers --strict-config -m 'not venue_contract'"
markers = ["venue_contract: เทสต์ที่เรียก Binance TH จริง — งาน CI แยกรันรายวัน (F-35)"]
# เทสต์ฐานข้อมูลเป็น async ทั้งหมด (F-03)
asyncio_mode = "auto"

# ─────────────────────────────────────────────────────────────
# import-linter — ทิศทางการพึ่งพา (RQ-6)
# บังคับผังใน specs/standards/architecture.md หัวข้อ 1
# ─────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = ["tiewtrade"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core ไม่พึ่งอะไรเลยนอกจาก standard library"
type = "forbidden"
source_modules = ["tiewtrade.core"]
forbidden_modules = [
    "tiewtrade.strategies",
    "tiewtrade.venues",
    "tiewtrade.infra",
    "tiewtrade.services",
    "fastapi",
    "uvicorn",
    "httpx",
    "websockets",
    "redis",
    # F-03 — core ห้ามแตะฐานข้อมูล (RQ-11)
    "sqlalchemy",
    "asyncpg",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "strategies, venues, infra พึ่งกันเองไม่ได้ และพึ่ง service ไม่ได้"
type = "independence"
modules = ["tiewtrade.strategies", "tiewtrade.venues", "tiewtrade.infra"]

[[tool.importlinter.contracts]]
name = "strategies, venues, infra ห้ามพึ่ง service"
type = "forbidden"
source_modules = ["tiewtrade.strategies", "tiewtrade.venues", "tiewtrade.infra"]
forbidden_modules = ["tiewtrade.services"]

[[tool.importlinter.contracts]]
name = "service ห้าม import กันเอง"
type = "independence"
modules = ["tiewtrade.services.api", "tiewtrade.services.engine", "tiewtrade.services.market_data", "tiewtrade.services.indicator_builder"]

# ส่วนกลางของ venues ต้องไม่รู้จักเครือข่าย (F-33 RQ-14)
# **ไม่ครอบ package ของตัวเชื่อมจริง** เพราะตัวเชื่อมต้องต่อเครือข่ายเป็นงานหลัก (F-35)
# ระบุรายไฟล์โดยเจตนา เพื่อให้การเพิ่มไฟล์ใหม่ในส่วนกลางต้องเพิ่มชื่อที่นี่ด้วย
[[tool.importlinter.contracts]]
name = "ส่วนกลางของ venues ห้ามพึ่งไลบรารีเครือข่าย"
type = "forbidden"
source_modules = [
    "tiewtrade.venues.candles",
    "tiewtrade.venues.candle_streams",
    "tiewtrade.venues.constraints",
    "tiewtrade.venues.errors",
    "tiewtrade.venues.fake",
    "tiewtrade.venues.limits",
    "tiewtrade.venues.moments",
    "tiewtrade.venues.prices",
    "tiewtrade.venues.price_streams",
    "tiewtrade.venues.signing",
    "tiewtrade.venues.symbols",
    "tiewtrade.venues.wallets",
]
forbidden_modules = ["httpx", "urllib", "socket", "websockets", "aiohttp", "requests", "asyncio"]

# ส่วนที่แปลข้อมูลและแปลข้อผิดพลาดของตัวเชื่อมต้องไม่รู้จักเครือข่าย (F-35)
# **ทุกโมดูลของตัวเชื่อมที่ไม่ได้ผ่าน `transport` ต้องอยู่ในรายการนี้** — เทสต์
# `test_venue_isolation.py` เทียบรายการนี้กับโครงสร้างจริง การเพิ่มโมดูลใหม่
# แล้วลืมเติมชื่อจึงแดงทันที ไม่ใช่เงียบไปเฉย ๆ
[[tool.importlinter.contracts]]
name = "การแปลข้อมูลของตัวเชื่อม Binance TH ห้ามรู้จักเครือข่าย"
type = "forbidden"
source_modules = [
    "tiewtrade.venues.binance_th.endpoints",
    "tiewtrade.venues.binance_th.failures",
    "tiewtrade.venues.binance_th.mapping",
    "tiewtrade.venues.binance_th.stream_mapping",
    "tiewtrade.venues.binance_th.candle_stream_mapping",
    "tiewtrade.venues.binance_th.rate_limit",
]
forbidden_modules = ["httpx", "urllib", "socket", "websockets", "aiohttp", "requests"]


[[tool.importlinter.contracts]]
name = "strategies must not reach realtime network clients"
type = "forbidden"
source_modules = ["tiewtrade.strategies"]
forbidden_modules = ["websockets", "redis"]
