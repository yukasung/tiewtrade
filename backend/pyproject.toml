[project]
name = "tiewtrade-backend"
version = "0.1.0"
description = "TiewTrade backend — Spot trading on Binance TH"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest>=8.3",
    "hypothesis>=6.119",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/strategies", "src/venues", "src/infra", "src/services"]

# ─────────────────────────────────────────────────────────────
# ruff — รูปแบบและ lint (RQ-8)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
# กรณีที่ต้องถูกปฏิเสธ (RQ-12) อยู่นอกเส้นทางที่ด่านปกติสแกน
# เทสต์ใน tests/gates/ จะรัน ruff กับไฟล์เหล่านี้เองและคาดหวังผลแดง
extend-exclude = ["tests/gates/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "RUF"]

# ─────────────────────────────────────────────────────────────
# mypy — ตรวจชนิดข้อมูล strict ทั้ง backend (RQ-10, P-3)
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
exclude = ["tests/gates/fixtures"]
strict = true
warn_unreachable = true
warn_no_return = true
extra_checks = true

# `core` เข้มกว่าที่อื่น เพราะโค้ดคำนวณเงินจะอยู่ที่นี่ทั้งหมด (RQ-10)
[[tool.mypy.overrides]]
module = "core.*"
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_expr = true

# ─────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"

# ─────────────────────────────────────────────────────────────
# import-linter — ทิศทางการพึ่งพา (RQ-6)
# บังคับผังใน specs/standards/architecture.md หัวข้อ 1
# ─────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = ["core", "strategies", "venues", "infra", "services"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core ไม่พึ่งอะไรเลยนอกจาก standard library"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "strategies",
    "venues",
    "infra",
    "services",
    "fastapi",
    "uvicorn",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "strategies, venues, infra พึ่งกันเองไม่ได้ และพึ่ง service ไม่ได้"
type = "independence"
modules = ["strategies", "venues", "infra"]

[[tool.importlinter.contracts]]
name = "strategies, venues, infra ห้ามพึ่ง service"
type = "forbidden"
source_modules = ["strategies", "venues", "infra"]
forbidden_modules = ["services"]

[[tool.importlinter.contracts]]
name = "service ห้าม import กันเอง"
type = "independence"
modules = ["services.api", "services.engine", "services.market_data"]
