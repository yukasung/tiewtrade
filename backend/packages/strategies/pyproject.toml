[project]
name = "tiewtrade-strategies"
version = "0.1.0"
description = "Built-in strategies; depends on tiewtrade-core only (D-06)"
requires-python = ">=3.12"
dependencies = ["tiewtrade-core"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade_strategies"]
