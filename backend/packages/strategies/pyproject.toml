[project]
name = "fasttrade-strategies"
version = "0.1.0"
description = "Built-in strategies; depends on fasttrade-core only (D-06)"
requires-python = ">=3.12"
dependencies = ["fasttrade-core"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasttrade_strategies"]
