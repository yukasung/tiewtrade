[project]
name = "fasttrade-binance"
version = "0.1.0"
description = "Binance REST/WebSocket clients and mapping per Exchange Venue"
requires-python = ">=3.12"
dependencies = ["fasttrade-core"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasttrade_binance"]
