[project]
name = "tiewtrade-binance"
version = "0.1.0"
description = "Binance REST/WebSocket clients and mapping per Exchange Venue"
requires-python = ">=3.12"
dependencies = ["tiewtrade-core"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiewtrade_binance"]
