[project]
name = "fasttrade-infra"
version = "0.1.0"
description = "Postgres repositories, Redis bus, leases, key provider, settings"
requires-python = ">=3.12"
dependencies = ["fasttrade-core"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fasttrade_infra"]
