# Local development infrastructure. Application services are added to this
# file as they are implemented (ADR-0008).
name: fasttrade

services:
  postgres:
    image: postgres:16-alpine          # Cloud SQL compatible major version (NFR-24)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fasttrade}
      POSTGRES_USER: ${POSTGRES_USER:-fasttrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]   # non-authoritative (ADR-0004)
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
