# Docker Compose — บางที่สุดเท่าที่งานที่ทำแล้วใช้จริง (F-01 RQ-18)
#
# เวอร์ชัน PostgreSQL มาจาก config/postgres.env ที่เดียว (F-03 plan.md ข้อ 8)
# เรียกจาก root ด้วย:
#   env -u POSTGRES_VERSION docker compose --env-file config/postgres.env up -d --build --wait
# การลบค่าจาก shell ก่อนอ่านไฟล์กันค่าภายนอกทับเวอร์ชันกลางโดยไม่ตั้งใจ
#
# F-10 adds public-price ingestion and Redis invalidations with process-scoped ACLs.
# worker ตรวจ API key ของ engine (F-07) รันด้วยมือ — ตัวตั้งเวลาเป็นงาน F-31
#
# **รหัสผ่านในไฟล์นี้ใช้ได้เฉพาะเครื่องนักพัฒนาและ CI** บนเครื่องจริงเป็นงาน F-31

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?ต้องรันด้วย --env-file config/postgres.env}
    environment:
      POSTGRES_DB: tiewtrade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # สคริปต์สร้างบทบาทรันครั้งเดียวตอนสร้างฐานข้อมูล ด้วย superuser ของ container
    volumes:
      - ./backend/db/bootstrap:/docker-entrypoint-initdb.d:ro
    # เปิดพอร์ตให้เทสต์บนเครื่องนักพัฒนาต่อได้ (testing.md — เทสต์ต้องรันกับฐานข้อมูลจริง)
    # 55432 บนเครื่องนักพัฒนา เพื่อไม่ชนกับ PostgreSQL ที่อาจติดตั้งไว้แล้วที่ 5432
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiewtrade"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--aclfile", "/etc/redis/users.acl"]
    volumes:
      - ./config/redis.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=dev_api_redis redis-cli --user api ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  market-data:
    build:
      context: ./backend
    command: ["python", "-m", "tiewtrade.services.market_data.main"]
    environment:
      TIEWTRADE_DATABASE_URL_MARKET_DATA: postgresql+asyncpg://tiewtrade_market_data:dev_market_data@postgres:5432/tiewtrade
      TIEWTRADE_REDIS_URL_MARKET_DATA: redis://market_data:dev_market_data_redis@redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in only. An orphan requires verified operator recovery before another boot.
  indicator-builder:
    profiles: ["prepared-indicators"]
    build:
      context: ./backend
    command: ["python", "-m", "tiewtrade.services.indicator_builder.main", "run"]
    environment:
      TIEWTRADE_DATABASE_URL_INDICATOR_BUILDER: postgresql+asyncpg://tiewtrade_indicator_builder:dev_indicator_builder@postgres:5432/tiewtrade
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    stop_grace_period: 130s

  # Paper-only durable command processor. It intentionally receives no venue URL
  # or sealing key, so this process cannot read credentials or submit Live orders.
  paper-wallet-worker:
    build:
      context: ./backend
    command: ["python", "-m", "tiewtrade.services.engine.paper_wallet_main"]
    environment:
      TIEWTRADE_DATABASE_URL_ENGINE: postgresql+asyncpg://tiewtrade_engine:dev_engine@postgres:5432/tiewtrade
      TIEWTRADE_DATABASE_URL_ENGINE_SCAN: postgresql+asyncpg://tiewtrade_engine_scan:dev_engine_scan@postgres:5432/tiewtrade
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # รันครั้งเดียวแล้วจบ — api รอให้เสร็จก่อนเริ่ม
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      TIEWTRADE_DATABASE_URL_MIGRATOR: postgresql+asyncpg://tiewtrade_migrator:dev_migrator@postgres:5432/tiewtrade
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    command: ["uvicorn", "tiewtrade.services.api.app:app", "--no-proxy-headers", "--host", "0.0.0.0", "--port", "8000", "--ws", "tiewtrade.services.api.price_protocol:PriceWebSocketProtocol"]
    build:
      context: ./backend
    environment:
      TIEWTRADE_DATABASE_URL_API: postgresql+asyncpg://tiewtrade_api:dev_api@postgres:5432/tiewtrade
      # บทบาทยืนยันตัวตนของ F-05 — บทบาทเดียวที่แตะข้อมูลเข้าสู่ระบบและออก session ได้
      TIEWTRADE_DATABASE_URL_AUTH: postgresql+asyncpg://tiewtrade_auth:dev_auth@postgres:5432/tiewtrade
      # เปิดให้สมัครในเครื่องพัฒนา — **ค่าเริ่มต้นของจริงคือปิด** (F-05 Q-1)
      TIEWTRADE_REDIS_URL_API: redis://api:dev_api_redis@redis:6379/0
      TIEWTRADE_PRICE_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TIEWTRADE_SIGNUP_OPEN: "1"
      # ปิดธง Secure เพราะ compose ให้บริการผ่าน http — บนเครื่องจริงห้ามปิด
      TIEWTRADE_COOKIE_SECURE: "0"
      # กุญแจปิดผนึก secret ของ TOTP (F-06) — **ค่านี้ใช้ได้เฉพาะเครื่องพัฒนาและ CI**
      # บนเครื่องจริงยังเป็นข้อที่ต้องตัดสิน (T-03) ซึ่งเป็นงาน F-31
      TIEWTRADE_SEALING_KEY_TOTP_SECRET: "1:ZGV2LW9ubHkta2V5LW5vdC1hLXNlY3JldC0zMmJ5dGU="
      # กุญแจของ API key แยกจาก TOTP (F-07 RQ-4) — ใช้เฉพาะพัฒนาและ CI
      TIEWTRADE_SEALING_KEY_VENUE_API_SECRET: "1:VlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlY="
      TIEWTRADE_SEALING_KEY_INDICATOR_CURSOR: "1:SUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUk="
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
